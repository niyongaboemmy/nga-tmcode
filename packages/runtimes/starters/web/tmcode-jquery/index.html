<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jQuery app</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>To-do list <small>with jQuery</small></h1>
      <form id="add">
        <input id="task" placeholder="Something to do" autocomplete="off" />
        <button>Add</button>
      </form>
      <ul id="list"></ul>
      <p id="count"></p>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
