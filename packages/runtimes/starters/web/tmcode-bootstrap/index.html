<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap site</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container">
        <a class="navbar-brand" href="#">My School</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#courses">Courses</a></li>
          </ul>
        </div>
      </div>
    </nav>
    <header class="container py-5 text-center">
      <h1 class="display-5 fw-bold">Learn to build the web</h1>
      <p class="lead">Bootstrap gives you a responsive grid and ready-made components.</p>
      <button class="btn btn-primary btn-lg" data-bs-toggle="modal" data-bs-target="#join">Join now</button>
    </header>
    <section id="courses" class="container pb-5">
      <div class="row g-4">
        <div class="col-md-4"><div class="card h-100"><div class="card-body"><h5 class="card-title">HTML</h5><p class="card-text">Structure your pages.</p></div></div></div>
        <div class="col-md-4"><div class="card h-100"><div class="card-body"><h5 class="card-title">CSS</h5><p class="card-text">Style and lay them out.</p></div></div></div>
        <div class="col-md-4"><div class="card h-100"><div class="card-body"><h5 class="card-title">JavaScript</h5><p class="card-text">Make them interactive.</p></div></div></div>
      </div>
    </section>
    <div class="modal fade" id="join" tabindex="-1">
      <div class="modal-dialog"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Join</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><input class="form-control" placeholder="Your email" /></div>
        <div class="modal-footer"><button class="btn btn-primary" data-bs-dismiss="modal">Send</button></div>
      </div></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
