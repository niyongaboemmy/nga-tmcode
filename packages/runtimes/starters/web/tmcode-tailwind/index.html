<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tailwind site</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <main class="min-h-screen bg-slate-50 flex items-center justify-center p-6">
      <div class="max-w-md w-full bg-white rounded-2xl shadow-lg p-8 space-y-4">
        <h1 class="text-2xl font-bold text-slate-800">Hello, Tailwind!</h1>
        <p class="text-slate-600">Every class is one CSS rule: <code class="bg-slate-100 px-1 rounded">p-8</code> is padding, <code class="bg-slate-100 px-1 rounded">rounded-2xl</code> rounds corners.</p>
        <button id="go" class="w-full rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white hover:bg-indigo-500 active:scale-95 transition">Click me</button>
        <p id="out" class="text-center text-sm text-slate-500"></p>
      </div>
    </main>
    <script>
      let n = 0;
      document.getElementById("go").onclick = () => (document.getElementById("out").textContent = "Clicked " + ++n + " times");
    </script>
  </body>
</html>
