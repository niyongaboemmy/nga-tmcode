name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, unit and e2e (Chromium + WebKit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Node 24 ships npm 11, which the lock file needs.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npx playwright install --with-deps chromium webkit
        working-directory: apps/desktop
      - run: npx playwright test
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/desktop/test-results
          retention-days: 7

  desktop:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      # The Rust crate embeds the built frontend.
      - run: npm run build
      - run: cargo test --locked
        working-directory: apps/desktop/src-tauri

  judge:
    name: tm-judge inside isolate (cgroup v2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Language runtimes and isolate build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcap-dev libsystemd-dev libseccomp-dev pkg-config python3 gcc g++ openjdk-21-jdk-headless
      - name: Build and start isolate v2.7
        run: |
          git clone --depth 1 --branch v2.7 https://github.com/ioi/isolate /tmp/isolate
          cd /tmp/isolate
          make isolate isolate-cg-keeper
          sudo make install
          if ! getent passwd isolate >/dev/null; then sudo adduser --quiet --disabled-login --home /nonexistent --no-create-home --shell /bin/false --comment "" isolate; fi
          grep -q '^isolate:' /etc/subuid || sudo usermod --add-subuids 1000000-1065535 isolate
          grep -q '^isolate:' /etc/subgid || sudo usermod --add-subgids 1000000-1065535 isolate
          sudo systemctl daemon-reload
          sudo systemctl start isolate.service || { sudo journalctl -u isolate.service --no-pager | tail -40; cat /sys/fs/cgroup/cgroup.controllers; exit 1; }
          sudo systemctl status isolate.service --no-pager
          isolate --version
          isolate-check-environment || true
      - run: npm ci
      - name: Judge tests in real boxes
        working-directory: services/judge
        env:
          JUDGE_TEST_SANDBOX: isolate
        run: npx vitest run --config vitest.config.ts
