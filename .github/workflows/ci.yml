name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Node 24 ships npm 11, which the lock file needs.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run

  e2e:
    # The suite runs one test at a time (one shared mock Task Mentor), so it is split across
    # runners instead: each browser in four shards, about 12 minutes in all instead of 70.
    name: e2e (${{ matrix.browser }} ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: apps/desktop
      - run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/4
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-${{ matrix.browser }}-${{ matrix.shard }}
          path: apps/desktop/test-results
          retention-days: 7

  desktop:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      # The Rust crate embeds the built frontend.
      - run: npm run build
      - run: cargo test --locked
        working-directory: apps/desktop/src-tauri

  judge:
    name: tm-judge inside isolate (cgroup v2)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # libgtest-dev: the cpp/cmake starter finds GoogleTest (install.sh installs it on runners too).
      # sqlite3: sql/sqlite starters with a schema and seed. python3-pandas/matplotlib/pytest: python/data
      # on a runner without uv (install.sh's optional apt packages). No gobjc: objc/single must report unavailable.
      - name: Language runtimes and isolate build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcap-dev libsystemd-dev libseccomp-dev pkg-config python3 gcc g++ openjdk-21-jdk-headless libgtest-dev sqlite3 python3-numpy python3-pandas python3-matplotlib python3-pytest
      # The JUnit console launcher, as install.sh puts it (java/single unit tests).
      - name: JUnit console launcher
        run: |
          u=https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.11.3/junit-platform-console-standalone-1.11.3.jar
          curl -fsSL -o /tmp/junit.jar "$u" && curl -fsSL -o /tmp/junit.jar.sha1 "$u.sha1"
          echo "$(cut -d' ' -f1 /tmp/junit.jar.sha1)  /tmp/junit.jar" | sha1sum -c -
          sudo install -D -m 0755 /tmp/junit.jar /opt/junit/junit-platform-console-standalone.jar
      # Every language the playgrounds offer, installed by the same script as the servers.
      - name: Runner languages (Go, Rust, PHP, Ruby, Bash, C#, Kotlin, Swift, Arduino)
        run: bash services/judge/deploy/install-languages.sh go rust php ruby bash csharp kotlin swift arduino
      - name: Build and start isolate v2.7
        run: |
          git clone --depth 1 --branch v2.7 https://github.com/ioi/isolate /tmp/isolate
          cd /tmp/isolate
          make isolate isolate-cg-keeper
          sudo make install
          if ! getent passwd isolate >/dev/null; then sudo adduser --quiet --disabled-login --home /nonexistent --no-create-home --shell /bin/false --comment "" isolate; fi
          grep -q '^isolate:' /etc/subuid || sudo usermod --add-subuids 1000000-1065535 isolate
          grep -q '^isolate:' /etc/subgid || sudo usermod --add-subgids 1000000-1065535 isolate
          sudo systemctl daemon-reload
          sudo systemctl start isolate.service || { sudo journalctl -u isolate.service --no-pager | tail -40; cat /sys/fs/cgroup/cgroup.controllers; exit 1; }
          sudo systemctl status isolate.service --no-pager
          isolate --version
          isolate-check-environment || true
      - run: npm ci
      - name: Judge tests in real boxes
        working-directory: services/judge
        env:
          JUDGE_TEST_SANDBOX: isolate
          # Fail (don't skip) when one of these can't run here.
          JUDGE_TEST_REQUIRE_KINDS: go/single,rust/single,php/single,ruby/single,bash/single,csharp/script,kotlin/single,swift/single,arduino/uno
        # Verbose: the log shows which real-box cases ran and which were skipped (toolchain missing).
        run: npx vitest run --config vitest.config.ts --reporter=verbose

  languages-ubuntu-2604:
    # The production runner's release: install-languages.sh must find every package there.
    # No isolate in a container: programs run in the local sandbox (the isolate job above
    # covers the boxes).
    name: Runner languages on Ubuntu 26.04
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 40
    steps:
      - name: Base packages
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl git python3 unzip xz-utils gnupg build-essential openjdk-21-jdk-headless >/dev/null
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install-languages.sh (every language)
        run: bash services/judge/deploy/install-languages.sh go rust php ruby bash csharp kotlin swift arduino
      - run: npm ci --ignore-scripts
      - name: Programs in every language
        working-directory: services/judge
        env:
          JUDGE_TEST_REQUIRE_KINDS: go/single,rust/single,php/single,ruby/single,bash/single,csharp/script,kotlin/single,swift/single,arduino/uno
        run: npx vitest run --config vitest.config.ts src/project.test.ts -t "in a real box|required kinds|csharp/script" --reporter=verbose
