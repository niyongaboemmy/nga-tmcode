[package]
name = "tmcode"
version = "0.8.0"
description = "TMCode: the VS Code-style exam code editor controlled and graded by Task Mentor"
authors = ["New Generation Academy"]
edition = "2021"
license = "UNLICENSED"
repository = "https://github.com/niyongaboemmy/nga-tmcode"
rust-version = "1.85"

[lib]
# `_lib` keeps the lib name distinct from the bin (Windows, cargo#8519).
name = "tmcode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
# Same pinned Tauri as nga-desktop: one set of WebView quirks to know.
tauri = { version = "=2.12.1", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-single-instance = { version = "2.5.2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-http = "2"
getrandom = "0.3"
notify-debouncer-mini = "0.6"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-store = "2.5.0"
tauri-plugin-log = "2.10.0"
tauri-plugin-dialog = "2"
# Terminal copy/paste: WebKit runs no copy for xterm's own (non-DOM) selection.
tauri-plugin-clipboard-manager = "2"
portable-pty = "0.9"
percent-encoding = "2"
base64 = "0.22"
# canonicalize() without Windows "\\?\" verbatim paths, which compilers reject.
dunce = "1"
# Extensions: unpacking .vsix files (deflate only).
zip = { version = "4.6", default-features = false, features = ["deflate-flate2"] }
# Git & GitHub: the PAT lives in the OS keychain only; avatars come back as data: URLs.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
# Debugging: js-debug is downloaded once, checked against a pinned SHA-256 and unpacked.
sha2 = "0.10"
# Projects: walk a folder the way git does (.gitignore, .tmignore).
ignore = "0.4"
hex = "0.4"
flate2 = "1"
tar = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
