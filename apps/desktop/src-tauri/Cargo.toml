[package]
name = "tmcode"
version = "0.1.0"
description = "TMCode: the VS Code-style exam code editor controlled and graded by Task Mentor"
authors = ["New Generation Academy"]
edition = "2021"
license = "UNLICENSED"
repository = "https://github.com/niyongaboemmy/nga-tmcode"
rust-version = "1.85"

[lib]
# `_lib` keeps the lib name distinct from the bin (Windows, cargo#8519).
name = "tmcode_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
# Same pinned Tauri as nga-desktop: one set of WebView quirks to know.
tauri = { version = "=2.12.1", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-store = "2.5.0"
tauri-plugin-log = "2.10.0"
tauri-plugin-dialog = "2"
portable-pty = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
